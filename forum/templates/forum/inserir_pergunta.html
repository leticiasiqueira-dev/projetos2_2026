{% extends "forum/base.html" %}

{% block content %}

<style>
  :root {
    --bg: #14081f; --panel: #1f1033; --panel-2: #271340; --line: #3a2158;
    --text: #f4eefb; --muted: #a996c4; --magenta: #d946c7; --danger: #f0546a; --safe: #2dd8ad;
  }
  body {
    background: radial-gradient(120% 140% at 15% 0%, #24123f 0%, var(--bg) 55%);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", Inter, system-ui, sans-serif;
  }
  header {
    background: linear-gradient(135deg, #4a1a63, #1f1033) !important;
    border-bottom: 1px solid var(--line);
  }
  header h1, header p { color: var(--text) !important; }
  header nav a { color: var(--magenta) !important; text-decoration: none; font-weight: 600; }
  header nav a:hover { text-decoration: underline; }
  main.container {
    background: var(--panel) !important;
    box-shadow: none !important;
    border: 1px solid var(--line);
  }
  main.container h2 { color: var(--text); }
  main.container p { color: var(--muted); }
  main.container label {
    color: var(--text);
    font-weight: 600;
    font-size: 14px;
  }
  main.container input[type=text],
  main.container textarea {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    color: var(--text);
    padding: 10px 12px;
    font-size: 14px;
    font-family: inherit;
    width: 100%;
    max-width: 500px;
    box-sizing: border-box;
  }
  main.container input[type=text]::placeholder,
  main.container textarea::placeholder { color: var(--muted); }
  main.container input[type=text]:focus,
  main.container textarea:focus {
    outline: none;
    border-color: var(--magenta);
  }
  main.container input[type=submit] {
    background: linear-gradient(135deg, #b6349d, #7c3aed);
    color: var(--text);
    border: none;
    padding: 10px 18px;
    border-radius: 10px;
    font-size: 14px;
    cursor: pointer;
  }
  main.container input[type="submit"]:hover { opacity: 0.9; }
</style>

<h2>Registrar ocorrência IoT</h2>

<p>
    Informe uma situação detectada por sensores ou durante o
    acompanhamento da operação.
</p>

<form name="form" method="post">
    {% csrf_token %}

    <p>
        <label for="titulo">
            Título da ocorrência:
        </label>
        <br>

        <input
            type="text"
            name="titulo"
            id="titulo"
            size="50"
            maxlength="200"
            placeholder="Ex.: Superaquecimento na máquina de produção"
            required
        >
    </p>

    <p>
        <label for="detalhe">
            Descreva o problema detectado:
        </label>
        <br>

        <textarea
            rows="6"
            cols="50"
            id="detalhe"
            name="detalhe"
            placeholder="Informe o sensor, o valor registrado e o equipamento afetado."
            required
        ></textarea>
    </p>

    <p>
        <label for="tentativa">
            Ação já realizada:
        </label>
        <br>

        <textarea
            rows="6"
            cols="50"
            id="tentativa"
            name="tentativa"
            placeholder="Descreva o que já foi feito para controlar a ocorrência."
        ></textarea>
    </p>

    <input
        type="submit"
        name="botao_inserir_pergunta"
        value="Registrar ocorrência"
    >
</form>

{% endblock %}
